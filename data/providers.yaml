# Free LLM API Catalog — permanent free tiers only
# SSOT for README generation. Do not put trial-only credits here.
# last_verified uses ISO date; quotas change — always re-check official docs.

meta:
  version: 1
  updated: "2026-07-15"
  criteria_zh: "仅收录提供持续可用免费档的模型厂商官方 API 与主流推理平台；排除一次性试用额度与非官方反代。"
  criteria_en: "Permanent free tiers only from model vendors and mainstream inference platforms. No one-shot trial credits or unofficial reverse proxies."

providers:
  # ── Model vendors ──────────────────────────────────────────
  - id: google-ai-studio
    name: Google AI Studio (Gemini)
    name_zh: Google AI Studio（Gemini）
    type: model_vendor
    region: US
    website: https://aistudio.google.com
    docs: https://ai.google.dev/gemini-api/docs
    api_key_url: https://aistudio.google.com/app/apikey
    openai_compatible: true
    base_url: https://generativelanguage.googleapis.com/v1beta
    credit_card_required: false
    phone_required: false
    free_tier:
      permanent: true
      notes_zh: "免费档在部分地区（如 EU/UK/CH）可能不可用；免费层提示词可能被用于产品改进（部分地区除外）。配额会调整，以官网为准。"
      notes_en: "Free tier may be unavailable in EU/UK/CH. Free-tier prompts may be used to improve products outside certain regions. Quotas change; verify official docs."
      rate_limits_summary: "Per-model; e.g. Flash-class often ~5–30 RPM / tens–thousands RPD; Gemma often higher RPD"
      data_used_for_training: true
      commercial_use: restricted
    models_sample:
      - gemini-2.5-flash
      - gemini-2.5-flash-lite
      - gemini-3.1-flash-lite
      - gemma-3-27b-it
    last_verified: "2026-07-15"
    status: active
    tags: [gemini, multimodal, official]

