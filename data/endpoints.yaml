# Free Testing LLM APIs
# 收录形态对齐 page-agent「Free Testing API」：
# 给出可直接粘贴的 LLM_BASE_URL / LLM_MODEL_NAME（及可选 KEY）
# 用途：技术评估 / Demo / R&D，默认不建议生产。
#
# 类别 category:
#   project_demo     - 开源项目为自家 Demo 提供的官方测试接口
#   anonymous_public - 无需注册/Key 的公开免费端点
#   free_token       - 零成本领取免费 token 后即可测

meta:
  version: 2
  updated: "2026-07-15"
  focus_zh: "免费测试用 LLM API 端点（BASE_URL + MODEL 可复制），非「注册领永久 free tier」平台清单。"
  focus_en: "Copy-paste free testing LLM endpoints (BASE_URL + MODEL), not permanent free-tier signup catalogs."
  disclaimer_zh: "多数端点仅供技术评估；可能随时限流、变更或下线。禁止生产、禁止输入敏感数据。请遵守各项目使用条款。"
  disclaimer_en: "Most endpoints are for technical evaluation only; may be rate-limited or removed anytime. Not for production or sensitive data. Follow each project's terms."

endpoints:
  # ── Project demo testing APIs ──────────────────────────────
  - id: page-agent-qwen
    name: Page Agent Free Testing API (Qwen)
    name_zh: Page Agent 免费测试接口（通义千问）
    category: project_demo
    provider: Alibaba page-agent maintainers (via Alibaba Cloud FC + BaiLian)
    region: CN
    status: active
    openai_compatible: true
    api_key_required: false
    base_url: https://page-ag-testing-ohftxirgbn.cn-shanghai.fcapp.run
    chat_path_hint: /chat/completions
    models:
      - qwen3.5-plus
      - qwen3.5-flash
    source_docs: https://alibaba.github.io/page-agent/docs/features/models/#free-testing-api
    source_repo: https://github.com/alibaba/page-agent
    terms: https://github.com/alibaba/page-agent/blob/main/docs/terms-and-privacy.md#2-testing-api-and-demo-disclaimer--terms-of-use
    restrictions_zh: |
      仅供 PageAgent.js / Extension 技术评估与 R&D。
      禁止生产环境；禁止输入 PII/敏感数据；数据经中国大陆服务器处理。
      代理会校验请求：首条需为 system/developer，且 system prompt 需匹配官方 page-agent 提示词（通用聊天可能被拒绝）。
      可能随时限流或下线。
    restrictions_en: |
      Strictly for PageAgent.js / Extension technical evaluation and R&D.
      No production use; no PII/sensitive data; processed via Mainland China servers.
      Proxy validates requests: first message must be system/developer and system prompt must match official page-agent prompt (generic chat may be rejected).
      May be rate-limited or discontinued without notice.
    env:
      LLM_BASE_URL: https://page-ag-testing-ohftxirgbn.cn-shanghai.fcapp.run
      LLM_MODEL_NAME: qwen3.5-plus
      # LLM_API_KEY: not required
    last_verified: "2026-07-15"
    tags: [page-agent, qwen, demo, no-key]

  # ── Anonymous public free endpoints ────────────────────────
  - id: ovhcloud-ai-endpoints-anonymous
    name: OVHcloud AI Endpoints (Anonymous Free)
    name_zh: OVHcloud AI Endpoints（匿名免费）
    category: anonymous_public
    provider: OVHcloud
    region: EU
    status: active
    openai_compatible: true
    api_key_required: false
    base_url: https://oai.endpoints.kepler.ai.cloud.ovh.net/v1
    chat_path_hint: /chat/completions
    models:
      - Meta-Llama-3_3-70B-Instruct
      - Llama-3.1-8B-Instruct
      - gpt-oss-120b
      - gpt-oss-20b
      - Qwen3-32B
      - Qwen3-Coder-30B-A3B-Instruct
      - Mistral-Small-3.2-24B-Instruct
      - Mistral-Nemo-Instruct-2407
      - Mistral-7B-Instruct-v0.3
    source_docs: https://www.ovhcloud.com/en/public-cloud/ai-endpoints/catalog/
    source_repo: null
    terms: https://www.ovhcloud.com/en/terms-and-conditions/
    restrictions_zh: |
      匿名档：无需注册、无需 API Key；约 2 RPM / IP / 模型（以官网为准）。
      适合联调 OpenAI SDK / Agent 工具；更高配额需 OVH 账号与计费项目。
      模型托管在欧盟。模型列表可能变更，请用 GET /v1/models 确认。
    restrictions_en: |
      Anonymous tier: no signup, no API key; about 2 RPM per IP per model (verify docs).
      Good for wiring OpenAI SDK / agents; higher limits need OVH account + billing project.
      EU-hosted. Catalog may change — check GET /v1/models.
    env:
      LLM_BASE_URL: https://oai.endpoints.kepler.ai.cloud.ovh.net/v1
      LLM_MODEL_NAME: Meta-Llama-3_3-70B-Instruct
      # LLM_API_KEY: not required for anonymous
    last_verified: "2026-07-15"
    tags: [ovh, eu, no-key, openai-compatible]

  # ── Free token / low-friction testing ──────────────────────
  - id: llm7
    name: LLM7.io
    name_zh: LLM7.io
    category: free_token
    provider: LLM7.io
    region: GB
    status: active
    openai_compatible: true
    api_key_required: true
    api_key_url: https://token.llm7.io
    base_url: https://api.llm7.io/v1
    chat_path_hint: /chat/completions
    models:
      - deepseek-v4-flash
      - gemma3:27b
      - gpt-5.4-mini
      - kimi-k2.6
      - minimax-m2.7
    source_docs: https://llm7.io
    source_repo: null
    terms: https://llm7.io
    restrictions_zh: |
      可免费领取 token；基础访问与限额以官网为准（有 token 通常更高 RPM）。
      第三方聚合网关，稳定性/合规/数据路径请自行评估；模型可用性会变。
      适合快速打通 OpenAI 兼容客户端做联调测试。
    restrictions_en: |
      Free token available; limits per official site (token usually raises RPM).
      Third-party gateway — evaluate stability, compliance, and data path yourself.
      Model availability changes; good for quick OpenAI-compatible client tests.
    env:
      LLM_BASE_URL: https://api.llm7.io/v1
      LLM_MODEL_NAME: deepseek-v4-flash
      LLM_API_KEY: "<get free token at https://token.llm7.io>"
    last_verified: "2026-07-15"
    tags: [gateway, free-token, openai-compatible]

